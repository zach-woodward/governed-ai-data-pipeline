strategies:
  MNPI:
    default: tokenize
    token_format: "[{ENTITY}_{N}]"
    reversible: true
    vault: local
    scope: per_document
  PII:
    default: tokenize
    token_format: "[{ENTITY}_{N}]"
    reversible: true
    vault: local
    scope: per_document
  PII.ssn: {default: drop, reversible: false}
  PCI:
    default: mask
    mask_char: "x"
    keep_last: 4
    reversible: false
minimum_necessary:
  profiles:
    surveillance_triage:
      description: "Triage a communication for supervisory review."
      keep_sections: [messages, transcript]
      drop_sections: [account, positions, compensation]
