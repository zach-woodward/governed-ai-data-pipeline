[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govpipe"
version = "0.1.0"
description = "A reference architecture for running LLM workloads over sensitive data with enforceable governance controls"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gov = "govpipe.cli:main"

[tool.setuptools]
packages = ["govpipe", "govpipe.policy", "govpipe.classify"]
package-data = {govpipe = ["static/*.html"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
